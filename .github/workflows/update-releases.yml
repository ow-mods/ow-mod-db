name: Update Releases

concurrency: update-releases

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - source
    paths:
      - "mods.json"
  pull_request:
    branches:
      - "source"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - run: npm ci
        working-directory: scripts

      - name: Checkout database repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          path: database

      - name: Get previous mods.json
        run: >-
          if [ "${{ github.event_name }}" = "push" ]; then
            git fetch origin "${{ github.event.before }}";
            git show "${{ github.event.before }}:mods.json" > previous-mods.json;
          else
            git show "HEAD~1:mods.json" > previous-mods.json;
          fi

      - name: Get previous database.json
        run: cp database/database.json previous-database.json

      - name: Build Database
        run: >-
          npm run update-database -- build
          --modsFile ../mods.json
          --outputDirectory ../database
          --previousDatabaseFile ../previous-database.json
        working-directory: scripts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit Database
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: database
        run: |
          git config user.name "Outer Wilds Mod Database"
          git config user.email "database@outerwildsmods.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit to the database repository"
          else
            git commit -m "Update mod database"
            git push origin master
          fi

      - name: Upload Pages Artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: database

      - name: Deploy to GitHub Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Dispatch Website Build
        if: ${{ github.event_name != 'pull_request' }}
        run: gh api -X POST repos/ow-mods/outerwildsmods.com/dispatches -f event_type=build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Wait for Website Build
        if: ${{ github.event_name != 'pull_request' }}
        # Notification links point at the website, which is rebuilt from the
        # just-deployed database; give the build time to finish first.
        run: sleep 300

      - name: Notify
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          npm run update-database -- notify
          --databaseDirectory ../database
          --previousDatabaseFile ../previous-database.json
          --modsFile ../mods.json
          --previousModsFile ../previous-mods.json
        working-directory: scripts
        env:
          DISCORD_MOD_HOOK_URLS: ${{ secrets.DISCORD_MOD_HOOK_URLS }}
          DISCORD_HOOK_URL: ${{ secrets.DISCORD_HOOK_URL }}
          DISCORD_MOD_UPDATE_ROLE_ID: ${{ secrets.DISCORD_MOD_UPDATE_ROLE_ID }}
          DISCORD_NEW_MOD_ROLE_ID: ${{ secrets.DISCORD_NEW_MOD_ROLE_ID }}
