name: Update Releases

concurrency: update-releases

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - source
    paths:
      - "mods.json"
  pull_request:
    branches:
      - "source"

permissions:
  contents: write
  pages: write
  actions: write
  id-token: write

jobs:
  update-releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - run: npm ci
        working-directory: scripts

      - name: Checkout database repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          path: database

      - name: Get previous mods.json
        run: >-
          if [ "${{ github.event_name }}" = "push" ]; then
            git fetch origin "${{ github.event.before }}";
            git show "${{ github.event.before }}:mods.json" > previous-mods.json;
          else
            git show "HEAD~1:mods.json" > previous-mods.json;
          fi

      - name: Get previous database.json
        run: cp database/database.json previous-database.json

      - name: Build Database
        run: >-
          npm run update-database -- build
          --modsFile ../mods.json
          --outputDirectory ../database
          --previousDatabaseFile ../previous-database.json
        working-directory: scripts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Deploy Database
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          npm run update-database -- deploy
          --databaseDirectory ../database
        working-directory: scripts
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Notify
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          npm run update-database -- notify
          --databaseDirectory ../database
          --previousDatabaseFile ../previous-database.json
          --modsFile ../mods.json
          --previousModsFile ../previous-mods.json
        working-directory: scripts
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          DISCORD_MOD_HOOK_URLS: ${{ secrets.DISCORD_MOD_HOOK_URLS }}
          DISCORD_HOOK_URL: ${{ secrets.DISCORD_HOOK_URL }}
          DISCORD_MOD_UPDATE_ROLE_ID: ${{ secrets.DISCORD_MOD_UPDATE_ROLE_ID }}
          DISCORD_NEW_MOD_ROLE_ID: ${{ secrets.DISCORD_NEW_MOD_ROLE_ID }}
